# @package _group_

# LNS-BUAP "Huapáctic".
# gpu2 partition: ampere[01-05], each gpu:A100:4 (80GB), 96 CPUs, 1TB RAM, 15-day walltime.
# Submit with: env=huapactic sbatch_args.partition=gpu2

python_bin: ${env.project_path}/env/bin/python
project_path: ${hydra:runtime.cwd}

# gpu2 nodes report AvailableFeatures=(null), so there is no feature to pin.
# cfg_to_args_str drops empty values, so no dangling --constraint is emitted.
slurm_constraint: ""

# launch.py asserts `dataset.path_for_slurm_job` exists before submitting, so this
# must point at a real directory holding <dataset.name>.zip.
datasets_dir: ${env.project_path}/data

# JIT-built CUDA ops (bias_act, upfirdn2d). Deliberately NOT /tmp: compute nodes get a
# fresh /tmp per job, so every job would pay the ~2min nvcc rebuild. Kept on the shared
# FS so it is built once. PyTorch takes a file lock here, so concurrent jobs are safe.
torch_extensions_dir: ${env.project_path}/.torch_extensions

before_train_commands:
  - 'module purge'
  # CUDA 11.1.1 is an exact match for torch 1.9.0+cu111, and the EasyBuild module
  # pairs it with gcc 10.2.0 — the host compiler CUDA 11.x needs (it rejects
  # anything newer than gcc 11; the cluster default is 12.2.0).
  # Do NOT take CUDA from conda here: its split cuda-* packages resolve to a mixed
  # toolkit (nvcc 11.8 + cudart 13.3 + libcublas 13.6) and lay headers out under
  # targets/x86_64-linux/ with libs in lib/, not the include//lib64/ that torch's
  # cpp_extension probes. See src/infra/setup_huapactic.sh.
  - 'module load CUDA/11.1.1-GCC-10.2.0'
  - 'module load Anaconda3/2022.05'
  - 'source "$(conda info --base)/etc/profile.d/conda.sh"'
  - 'conda activate ${env.project_path}/env'
  # A100 is sm_80. Pin it so the JIT extension build does not probe the device.
  - 'export TORCH_CUDA_ARCH_LIST="8.0"'
  - 'export CUDA_HOME="${EBROOTCUDA:-$CUDA_HOME}"'
  - 'export PATH="$CUDA_HOME/bin:$PATH"'
  # Host compiler stays the conda one that `conda activate` exported CC/CXX for.
  # The gpu2 node images report glibc-devel installed but ship no
  # /usr/include/features.h, so the module's gcc cannot compile on a compute node
  # (it works on the login node, which makes this easy to miss). conda's
  # gcc_linux-64 carries its own glibc sysroot and works on both.
  - 'echo "[huapactic] CUDA_HOME=$CUDA_HOME CXX=${CXX:-unset}"'
  - 'echo "[huapactic] node=$(hostname) allocation:"; nvidia-smi -L'
